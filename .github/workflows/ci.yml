name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Toda segunda, 09:00 UTC: pega vulnerabilidades publicadas mesmo sem PR.
  schedule:
    - cron: "0 9 * * 1"

# O GITHUB_TOKEN deste workflow só pode ler o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres real para os testes de integração (pulados sem TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/collab_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - run: migrate -path migrations -database "$TEST_DATABASE_URL" up
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # Prova que as migrations aplicam e desfazem sem erro num Postgres real.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/collab?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - run: migrate -path migrations -database "$DATABASE_URL" up
      - run: migrate -path migrations -database "$DATABASE_URL" down -all
      - run: migrate -path migrations -database "$DATABASE_URL" up

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Falha só com vulnerabilidades que o código de fato alcança.
      # v1.7.0 é a última que compila com Go 1.25 (v1.8.0 exige 1.26, ver #13).
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
