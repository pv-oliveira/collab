name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Toda segunda, 09:00 UTC: pega vulnerabilidades publicadas mesmo sem PR.
  schedule:
    - cron: "0 9 * * 1"

# O GITHUB_TOKEN deste workflow só pode ler o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Falha só com vulnerabilidades que o código de fato alcança.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
